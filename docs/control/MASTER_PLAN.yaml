format: pz-agent-master-plan/1
repository: https://github.com/natural0101/poject-zombigpt
rule: progress = sum(weight of PASS tasks) / sum(weight of all tasks) * 100. Task count is not progress.
  An epic does not close because its tasks did.
weight_bands:
  doc:
  - 1
  - 2
  audit:
  - 1
  - 3
  portability:
  - 3
  - 5
  packaging:
  - 3
  - 5
  evidence:
  - 4
  - 6
  transport:
  - 5
  - 6
  integration:
  - 7
  - 8
  security:
  - 7
  - 9
  live:
  - 9
  - 10
statuses:
- NOT_STARTED
- IN_PROGRESS
- BLOCKED
- FAIL
- PASS
metrics:
  CODE_IMPLEMENTATION:
  - E03
  - E05
  - E06
  - E08
  - E09
  - E10
  WINDOWS_COMPATIBILITY:
  - E02
  - E04
  MCP_OPERABILITY:
  - E07
  VOICE_OPERABILITY:
  - E09
  - E10
  RC_PACKAGING:
  - E11
  LIVE_GAME_VALIDATION:
  - E14
  FINAL_RELEASE:
  - E15
