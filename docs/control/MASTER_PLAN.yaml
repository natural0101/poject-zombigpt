- id: E02
  title: Windows portability
  subsystem: platform
  integration_scenario: The full test suite runs on windows-latest with zero failures, on a run that also
    builds both executables and assembles the archive — so the portability work is exercised by the packaging
    path and not only by unit tests.
  required_ci: https://github.com/natural0101/poject-zombigpt/actions/workflows/windows.yml
  milestones:
  - id: E02-M01
    title: The path model
    tasks:
    - id: E02-M01-T001
      subsystem: platform
      action: Introduce portable_relative_path() as the one system-to-recorded conversion
      weight: 4
      band: portability
      owner: remote
      depends_on: []
      pass_criterion: the function returns a POSIX-separated path relative to a root, and raises rather
        than falling back to an absolute path
      verify_command: .venv/bin/pytest tests/contract/test_portable_paths.py -q
      regression_test: tests/contract/test_portable_paths.py
      evidence: packages/pz_agent_core/src/pz_agent_core/platform/paths.py
      status: PASS
      implementation_commit: 15296e507958501b7c2737c4676813c30d6a9d15
      verification_commit: 15296e507958501b7c2737c4676813c30d6a9d15
      commit: 15296e507958501b7c2737c4676813c30d6a9d15
      ci_url: null
      reason: ''
    - id: E02-M01-T002
      subsystem: platform
      action: Preserve the path flavour rather than coercing to the running platform's
      weight: 5
      band: portability
      owner: remote
      depends_on:
      - E02-M01-T001
      pass_criterion: portable_relative_path(PureWindowsPath, PureWindowsPath) returns POSIX separators
        on Linux, and dropping as_posix() fails a test there
      verify_command: .venv/bin/pytest tests/contract/test_portable_paths.py -q
      regression_test: tests/contract/test_portable_paths.py::test_a_windows_path_is_recorded_with_posix_separators
